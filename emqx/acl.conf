%% EMQX file authorizer - Phase 2 ACL basics.
%%
%% Rules are evaluated top-to-bottom, first match wins. Anything not matched
%% falls through to the broker's authorization.no_match (default: allow) - dev
%% only. Strict per-role enforcement (super_admin JWT -> broker) lands in
%% Phase 4/5; here we just reserve the sensitive command topics.

%% Reserve control + actuator command topics for later super_admin enforcement.
{deny, all, all, ["snrub/reactor/control/#", "snrub/plant/actuators/#"]}.

%% Panels may acknowledge alarms.
{allow, all, publish, ["snrub/alarms/+/ack"]}.

%% Dev: allow read/write on the rest of the telemetry + alarm tree.
{allow, all, all, ["snrub/#"]}.

%% System topics for the dashboard / tooling.
{allow, all, subscribe, ["$SYS/#"]}.
