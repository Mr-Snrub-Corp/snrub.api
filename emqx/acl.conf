%% EMQX file authorizer - Phase 4 actuator ACL.
%%
%% Rules are evaluated top-to-bottom, first match wins. Anything not matched
%% falls through to authorization.no_match (default: allow) - dev only.
%%
%% {username, ...} only binds if the client authenticated. Browsers stay
%% anonymous on the WS listener (enable_authn=false) and hit the deny.

%% API publishes retained setpoints; simulator subscribes. Nobody else.
%% Usernames must match MQTT_API_USERNAME / MQTT_SIM_USERNAME (defaults below).
{allow, {username, "snrub_api"}, publish,   ["snrub/plant/actuators/#"]}.
{allow, {username, "snrub_sim"}, subscribe, ["snrub/plant/actuators/#"]}.
{deny, all, all, ["snrub/reactor/control/#", "snrub/plant/actuators/#"]}.

%% Panels may acknowledge alarms.
{allow, all, publish, ["snrub/alarms/+/ack"]}.

%% Dev: allow read/write on the rest of the telemetry + alarm tree.
{allow, all, all, ["snrub/#"]}.

%% System topics for the dashboard / tooling.
{allow, all, subscribe, ["$SYS/#"]}.
