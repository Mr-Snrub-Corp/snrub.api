# Posts the coverage comment for PRs opened from forks.
#
# A fork PR's GITHUB_TOKEN is read-only, so the "Coverage comment" step in
# test.yaml cannot post; it uploads the rendered comment as an artifact instead.
# workflow_run fires in the base repo's trusted context, where the token can write.
#
# GitHub reads workflow_run triggers from the default branch only, so this file
# has no effect until it lands on main. Same-repo PRs are posted directly by
# test.yaml and do not depend on this workflow.
name: Post coverage comment

on:
  workflow_run:
    workflows: ["Python Tests"]
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}

  # Same hand-off for the body-coverage comment from scripts/coverage_body.py.
  # Separate job so a failure here cannot affect the coverage comment above.
  body-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      # Checkout first: actions/checkout cleans the workspace and would delete
      # the downloaded artifact if it ran second.
      - uses: actions/checkout@v4

      - name: Download body coverage
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: body-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Absent for same-repo PRs, which post directly from test.yaml.
      - name: Post comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/pr-comment.sh "$(cat body-coverage-pr.txt)" body-coverage.md '<!-- body-coverage -->'
