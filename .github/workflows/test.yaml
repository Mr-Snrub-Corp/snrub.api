name: Python Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Post the coverage comment on same-repo PRs.
      pull-requests: write
      # Write the coverage badge / history data branch on push to main.
      contents: write

    env:
      APP_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_db
      JWT_SECRET: test-jwt-secret-for-ci
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MINUTES: 60
      GOOGLE_CLIENT_ID: placeholder-client-id
      GOOGLE_CLIENT_SECRET: placeholder-client-secret
      GOOGLE_AUTH_REDIRECT_URI: http://localhost:8000/api/auth/google/callback

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v --cov --cov-report=term-missing

      # The headline coverage number is inflated by import-time lines -- imports,
      # decorators, SQLModel field declarations -- which execute as soon as the
      # suite imports the app, test or no test. This reports the same data split
      # into import-time vs function-body buckets. Always generated so the run
      # summary has it on pushes to main too; only commented on PRs.
      - name: Body coverage report
        run: |
          {
            echo '<!-- body-coverage -->'
            echo '### Coverage excluding import-time lines'
            echo
            echo 'Imports, decorators and field declarations run on import whether or not a'
            echo 'test exists. Below is the same coverage data with those separated out --'
            echo '`function body` is the figure that moves when you write a test.'
            echo
            uv run python scripts/coverage_body.py --markdown
          } > body-coverage.md
          cat body-coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.event.pull_request.number }}" > body-coverage-pr.txt

      - name: Post body coverage comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pr-comment.sh "${{ github.event.pull_request.number }}" body-coverage.md '<!-- body-coverage -->'

      # Fork PRs get a read-only token, so hand the body off to coverage.yaml,
      # which runs in the base repo's trusted context.
      - name: Store body coverage for fork PRs
        uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: body-coverage
          path: |
            body-coverage.md
            body-coverage-pr.txt

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: notice

      # Fork PRs get a read-only token, so the step above writes the comment to a
      # file instead of posting it. coverage.yaml picks this up and posts it.
      - name: Store coverage comment for fork PRs
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
