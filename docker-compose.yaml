services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: mot-fastapi:dev
    container_name: fastapi-application
    env_file: .env.development
    environment:
      APP_ENV: development
    volumes:
      - ./app:/fastapi/app
      - ./tests:/fastapi/tests
      - ./.env.development:/fastapi/.env.development
      - ./pyproject.toml:/fastapi/pyproject.toml
      - ./uv.lock:/fastapi/uv.lock
      - ./migrations:/fastapi/migrations
      - ./seeds:/fastapi/seeds
      - ./scripts:/fastapi/scripts
    ports:
      - "8000:8000"
    restart: "no"
    depends_on:
      - db
      - emqx

  simulator:
    image: mot-fastapi:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: snrub-simulator
    # The image ENTRYPOINT is scripts/start-dev.sh (migrations + seeds + uvicorn);
    # the simulator waits for the api to have migrated instead.
    entrypoint: ["python", "-m", "app.simulator"]
    env_file: .env.development
    environment:
      APP_ENV: development
      MQTT_HOST: emqx
    volumes:
      - ./app:/fastapi/app
      - ./.env.development:/fastapi/.env.development
    restart: "no"
    depends_on:
      - db
      - emqx
    deploy:
      replicas: 1 # the tick loop must be a singleton (docs/roadmap.md Phase 3)

  client:
    build:
      context: ../snrub.client
      dockerfile: Dockerfile
    image: snrub-client:dev
    container_name: vue-application
    volumes:
      - ../snrub.client:/vue
      - /vue/node_modules
    ports:
      - "5173:5173"
    restart: "no"
    profiles:
      - vue

  react-client:
    build:
      context: ../snrub.react
      dockerfile: Dockerfile
    image: snrub-react:dev
    container_name: react-application
    volumes:
      - ../snrub.react:/react
      - /react/node_modules
    ports:
      - "5173:5173"
    restart: "no"
    profiles:
      - react

  db:
    image: postgres:15-alpine
    env_file: .env.development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:5.8
    container_name: emqx-broker
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    ports:
      - "1883:1883" # MQTT
      - "8083:8083" # MQTT over WebSocket (mqtt.js)
      - "18083:18083" # Dashboard
    restart: "no"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  postgres_data:
